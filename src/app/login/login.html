<div>
    <h1>Login</h1>
<form [formGroup]="loginForm" (ngSubmit)="onSubmit()">    
    <mat-form-field appearance="outline">
        <mat-label>Username</mat-label>
        <input id="username" matInput placeholder="Your username here..." formControlName="username">
    </mat-form-field>

    <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input id="password" matInput placeholder="Your password here..." formControlName="password">
    </mat-form-field>

    <p>Completa el formulario para activar el botón.</p>
    <button matButton="elevated" type="submit" [disabled]="!loginForm.valid" (click)="onSubmit()">Login</button>
    </form>

    <p>{{message}}</p>

</div>
