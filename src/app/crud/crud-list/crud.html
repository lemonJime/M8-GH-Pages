<div class="adding-user-form">
    <h1>Añade un usuario a la lista </h1>
    <form [formGroup]="usersForm">
        <mat-form-field appearance="outline">
            <mat-label>Nombre</mat-label>
            <input id="newUserFirstName" matInput placeholder="Escribe el nombre..." formControlName="newUserFirstName">
        </mat-form-field>
        <mat-form-field appearance="outline">
            <mat-label>Apellidos</mat-label>
            <input id="newUserLastName" matInput placeholder="Escribe el apellido..." formControlName="newUserLastName">
        </mat-form-field>
        <mat-form-field appearance="outline">
            <mat-label>Email</mat-label>
            <input id="newUserEmail" matInput placeholder="Email..." formControlName="newUserEmail">
        </mat-form-field>
        <mat-form-field appearance="outline">
            <mat-label>Phone</mat-label>
            <input id="newUserPhone" matInput placeholder="Phone..." formControlName="newUserPhone">
        </mat-form-field>
        <button matButton="elevated" type="submit" (click)="addUser()">Añadir</button>

    </form>
</div>

<div class="users-list">
    <h1>Lista de Usuarios</h1>
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

        <ng-container matColumnDef="Name">
            <th mat-header-cell *matHeaderCellDef> Name </th>
            <td mat-cell *matCellDef="let user"> {{user.name.first}} {{user.name.last}} </td>
        </ng-container>

        <ng-container matColumnDef="Email">
            <th mat-header-cell *matHeaderCellDef> Email </th>
            <td mat-cell *matCellDef="let user"> {{user.email}} </td>
        </ng-container>

        <ng-container matColumnDef="Phone">
            <th mat-header-cell *matHeaderCellDef> Phone </th>
            <td mat-cell *matCellDef="let user"> {{user.phone}} </td>
        </ng-container>

        <ng-container matColumnDef="Actions">
            <th mat-header-cell *matHeaderCellDef> Acciones </th>
            <td mat-cell *matCellDef="let user">
                <button mat-button color="warn" (click)="delete(user); $event.stopPropagation()">
                    Eliminar
                </button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns; let i = index" (click)="select(row, i)"></tr>
    </table>
</div>

<div>
    @if(userSelected) {
    <h1>Datos del usuario</h1>
    <app-crud-edit [userSelected]="userSelected" (onUpdateUser)="update($event)"></app-crud-edit>
    } @else {
    <p>Selecciona un usuario de la tabla para editarlo</p>
    }
</div>
